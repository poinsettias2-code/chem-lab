<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>중화적정 수행평가 (모바일 호환)</title>
    <style>
        /* --- [1. 기본 및 레이아웃 스타일] --- */
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px 0; box-sizing: border-box; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); width: 100%; max-width: 900px; box-sizing: border-box; position: relative; }
        
        .step-layer { display: none; }
        .step-layer.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 30px; font-size: 1.6em; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; background: #3498db; color: white; font-size: 1.1em; margin-top: 10px; }
        button:hover { background: #2980b9; transform: translateY(-2px); }
        .btn-next { background: #27ae60; font-size: 1.2em; }
        .btn-next:hover { background: #219653; }

        /* --- [2. Step 1: 예비보고서 스타일] --- */
        .form-group { margin-bottom: 20px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-row > div { flex: 1; min-width: 120px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; font-size: 1.05em; }
        input[type="text"], textarea, input[type="number"] { width: 100%; padding: 14px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; font-size: 1.05em; background: #f8f9fa; }
        input[type="text"]:focus, textarea:focus, input[type="number"]:focus { border-color: #3498db; background: #fff; outline: none; }
        textarea { height: 150px; resize: none; line-height: 1.5; }

        /* --- [3. Step 2: 가상 실험 및 계산기 스타일] --- */
        #sim-wrapper { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
        
        /* 모바일에서는 캔버스가 화면 중앙에 꽉 차게 조절 */
        #apparatus-view { width: 320px; height: 850px; background: #ffffff; border: 1px solid #e0e4e8; border-radius: 12px; display: flex; justify-content: center; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.02); margin: 0 auto; touch-action: none; /* 모바일 터치 스크롤 방지 */ }
        #main-canvas { cursor: crosshair; }
        
        #controls { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 15px; width: 100%; }
        
        .data-card { background: #f8f9fa; padding: 18px; border-radius: 12px; border: 1px solid #dee2e6; width: 100%; box-sizing: border-box; }
        .report-card { background: #f0f8ff; border: 1px solid #b3d7ff; }
        
        input[type=range] { width: 100%; cursor: pointer; height: 40px; } /* 슬라이더 터치 영역 확대 */
        
        .exam-info { font-size: 1.05em; color: #155724; font-weight: bold; background: #d4edda; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #c3e6cb; line-height: 1.5; }
        
        /* 계산기 UI */
        .calc-container { background: #e9ecef; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ced4da; }
        .calc-display { width: 100%; height: 45px; text-align: right; margin-bottom: 10px; font-size: 1.4em; border: 1px solid #adb5bd; border-radius: 4px; padding: 5px 10px; box-sizing: border-box; background: white; color: #333; font-family: monospace; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-btn { padding: 15px 0; font-size: 1.3em; background: #fff; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer; font-weight: bold; color: #495057; width: 100%; margin: 0; touch-action: manipulation; }
        .calc-btn:active { background: #e2e6ea; }
        .calc-btn.op { background: #dae0e5; color: #0056b3; }
        .calc-btn.action { background: #e74c3c; color: white; border: none; }
        .calc-btn.action.eq { background: #3498db; }

        #result-msg { margin-top: 15px; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; display: none; line-height: 1.5; font-size: 1.1em; }

        /* --- [4. Step 3: 제출 완료 스타일] --- */
        .success-view { text-align: center; padding: 50px 0; }
        .success-icon { font-size: 80px; color: #27ae60; margin-bottom: 20px; }

        /* --- 📱 모바일 최적화(미디어 쿼리) --- */
        @media (max-width: 768px) {
            body { padding: 0; background: white; }
            .container { padding: 20px; border-radius: 0; box-shadow: none; }
            h1 { font-size: 1.4em; }
            .form-row { flex-direction: column; gap: 0; }
            #apparatus-view { transform: scale(0.95); transform-origin: top center; height: 810px; margin-bottom: -20px; }
        }
/* 워터마크 스타일 */
.watermark {
    position: fixed;
    bottom: 10px;
    right: 15px;
    font-size: 12px;
    color: rgba(0, 0, 0, 0.3); /* 아주 연하게 표시 (숫자가 낮을수록 투명) */
    z-index: 9999;             /* 어떤 요소보다 위에 표시 */
    pointer-events: none;      /* 마우스 클릭 방해 금지 */
    user-select: none;         /* 글자 드래그 방지 */
    font-family: 'Malgun Gothic', sans-serif;
}
    </style>
</head>
<body>

<div class="container">
    <div id="step-1" class="step-layer active">
        <h1>Step 1. 실험 설계 및 예비 보고서</h1>
        <div class="form-row">
            <div>
                <label>학번</label>
                <input type="number" id="student-id" placeholder="예: 20101">
            </div>
            <div>
                <label>이름</label>
                <input type="text" id="student-name" placeholder="예: 홍길동">
            </div>
        </div>
        <div class="form-group">
            <label>실험 가설 설정</label>
            <textarea id="hypothesis" placeholder="중화 적정의 원리를 바탕으로 실험 결과를 예측하여 기술하시오."></textarea>
        </div>
        <button class="btn-next" onclick="nextStep(2)">가상 실험 시작하기 →</button>
    </div>

    <div id="step-2" class="step-layer">
        <h1 style="margin-bottom: 20px;">Step 2. 가상 실험 및 결과 분석</h1>
        <div id="sim-wrapper">
            <div id="apparatus-view">
                <canvas id="main-canvas" width="320" height="850"></canvas>
            </div>
            
            <div id="controls">
                <div class="exam-info" id="exam-data-display">대기 중...</div>
                
                <div class="data-card">
                    <span class="label">🎚️ 뷰렛 콕(Cock) 조절 (돋보기: 화면 터치)</span>
                    <input type="range" id="cock-slider" min="0" max="100" value="0">
                </div>

                <div class="data-card report-card">
                    <span class="label" style="margin-bottom: 10px;">🧮 실험용 계산기</span>
                    <div class="calc-container">
                        <input type="text" id="calc-display" class="calc-display" readonly value="0">
                        <div class="calc-grid">
                            <button class="calc-btn action" onclick="calcInput('C')">C</button>
                            <button class="calc-btn op" onclick="calcInput('(')">(</button>
                            <button class="calc-btn op" onclick="calcInput(')')">)</button>
                            <button class="calc-btn op" onclick="calcInput('/')">÷</button>
                            <button class="calc-btn" onclick="calcInput('7')">7</button>
                            <button class="calc-btn" onclick="calcInput('8')">8</button>
                            <button class="calc-btn" onclick="calcInput('9')">9</button>
                            <button class="calc-btn op" onclick="calcInput('*')">×</button>
                            <button class="calc-btn" onclick="calcInput('4')">4</button>
                            <button class="calc-btn" onclick="calcInput('5')">5</button>
                            <button class="calc-btn" onclick="calcInput('6')">6</button>
                            <button class="calc-btn op" onclick="calcInput('-')">-</button>
                            <button class="calc-btn" onclick="calcInput('1')">1</button>
                            <button class="calc-btn" onclick="calcInput('2')">2</button>
                            <button class="calc-btn" onclick="calcInput('3')">3</button>
                            <button class="calc-btn op" onclick="calcInput('+')">+</button>
                            <button class="calc-btn" onclick="calcInput('0')">0</button>
                            <button class="calc-btn" onclick="calcInput('.')">.</button>
                            <button class="calc-btn action eq" style="grid-column: span 2;" onclick="calcInput('=')">=</button>
                        </div>
                    </div>

                    <div style="margin-top: 15px; border-top: 1px dashed #b3d7ff; padding-top: 15px;">
                        <span style="font-weight:bold; color:#2c3e50;">최종 미지 시료 농도 :</span>
                        <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
                            <input type="number" id="input-conc" step="0.001" placeholder="0.000" style="flex:1;">
                            <span style="font-weight:bold;">M</span>
                        </div>
                    </div>

                    <button class="btn-next" onclick="submitFinalData()">✅ 답안 제출 및 평가 받기</button>
                    <div id="result-msg"></div>
                </div>

                <button onclick="initExperiment()" style="background: #95a5a6;">새로운 시료 받기 (리셋)</button>
            </div>
        </div>
    </div>

    <div id="step-3" class="step-layer">
        <div class="success-view">
            <div class="success-icon">✓</div>
            <h2 style="color: #2c3e50;">데이터 제출 완료</h2>
            <p style="color: #34495e; line-height: 1.5;">선생님의 구글 스프레드시트로<br>보고서와 결과가 전송되었습니다.</p>
            <button onclick="location.reload()" style="background:#7f8c8d; margin-top:30px;">처음으로 돌아가기</button>
        </div>
    </div>
</div>

<script>
    // =========================================================
    // 1. 구글 시트 연동 URL
    // =========================================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0-HoKVmDdD43WziQtKBRlduZ0JFiBbdDrt8mHEfD5wZO_wEPQzeQvvR0wPdSWdqmy/exec";

    function nextStep(step) {
        if (step === 2) {
            const studentId = document.getElementById('student-id').value.trim();
            const studentName = document.getElementById('student-name').value.trim();
            if (!studentId || !studentName) { 
                alert("학번과 이름을 모두 입력해주세요."); 
                return; 
            }
            initExperiment(); 
        }
        document.querySelectorAll('.step-layer').forEach(el => el.classList.remove('active'));
        document.getElementById(`step-${step}`).classList.add('active');
        window.scrollTo(0, 0); // 모바일 화면 전환 시 최상단으로 스크롤 이동
    }

    async function submitFinalData() {
        if(!isStarted) return;
        const studentConc = parseFloat(document.getElementById('input-conc').value);
        if(isNaN(studentConc)) { alert("최종 농도를 입력해주세요."); return; }

        const errorRate = Math.abs(studentConc - targetConc) / targetConc * 100;
        const resultMsg = document.getElementById('result-msg');
        resultMsg.style.display = 'block';
        let grade = "";
        
        if (errorRate <= 5.0) {
            grade = "A";
            resultMsg.style.background = '#d4edda'; resultMsg.style.color = '#155724'; resultMsg.style.border = '1px solid #c3e6cb';
            resultMsg.innerHTML = `🎉 <b>평가: A (만점)</b><br>오차율: ${errorRate.toFixed(1)}%`;
        } else if (errorRate <= 10.0) {
            grade = "B";
            resultMsg.style.background = '#fff3cd'; resultMsg.style.color = '#856404'; resultMsg.style.border = '1px solid #ffeeba';
            resultMsg.innerHTML = `⚠️ <b>평가: B (부분점수)</b><br>오차율: ${errorRate.toFixed(1)}%<br>과적정 되었습니다.`;
        } else {
            grade = "C (재실험 수준)";
            resultMsg.style.background = '#f8d7da'; resultMsg.style.color = '#721c24'; resultMsg.style.border = '1px solid #f5c6cb';
            resultMsg.innerHTML = `❌ <b>평가: C (오차 초과)</b><br>오차율: ${errorRate.toFixed(1)}%`;
        }

        const payload = {
            studentId: document.getElementById('student-id').value,
            studentName: document.getElementById('student-name').value,
            hypothesis: document.getElementById('hypothesis').value,
            targetVol: targetVol,
            usedNaOH: droppedVol.toFixed(2),
            calculatedConc: studentConc,
            actualConc: targetConc,
            errorRate: errorRate.toFixed(1) + "%",
            grade: grade
        };

        if(confirm("제출하시겠습니까? (제출 후 수정 불가)")) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                setTimeout(() => { nextStep(3); }, 2500);
            } catch (e) {
                alert("서버 전송 중 오류가 발생했습니다.");
            }
        }
    }

    // =========================================================
    // 2. 계산기 로직
    // =========================================================
    let calcExpression = "";
    function calcInput(val) {
        const disp = document.getElementById('calc-display');
        if (val === 'C') { calcExpression = ""; disp.value = "0"; } 
        else if (val === '=') {
            try {
                let evalExpr = calcExpression.replace(/×/g, '*').replace(/÷/g, '/');
                let result = eval(evalExpr);
                if (!Number.isInteger(result)) result = parseFloat(result.toFixed(4));
                disp.value = result; calcExpression = result.toString(); 
            } catch(e) { disp.value = "Error"; calcExpression = ""; }
        } else {
            if(disp.value === "0" && val !== '.') calcExpression = "";
            calcExpression += val; disp.value = calcExpression;
        }
    }

    // =========================================================
    // 3. 시뮬레이터 (Canvas) 및 모바일 터치 이벤트
    // =========================================================
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    const cockSlider = document.getElementById('cock-slider');
    const examDisplay = document.getElementById('exam-data-display');

    const CX = 160, B_START_Y = 50, B_END_Y = 450, TIP_BOTTOM_Y = 550;    
    const F_TOP_Y = 620, F_NECK_BOTTOM_Y = 670, F_BOTTOM_Y = 820;      
    const F_RADIUS_TOP = 18, F_RADIUS_BOTTOM = 85;
    const B_MAX_ML = 50, PIXELS_PER_ML = (B_END_Y - B_START_Y) / B_MAX_ML;

    const STD_CONC = 0.1; 
    let targetConc = 0, targetVol = 0, requiredVol = 0;
    let initialBuretteLevel = 0, currentBuretteLevel = 0, droppedVol = 0.00;
    let drops = [], splashes = []; 
    let mouseX = 0, mouseY = 0, isMouseIn = false, isStarted = false;

    function initExperiment() {
        isStarted = true; cockSlider.value = 0; droppedVol = 0.00; drops = []; splashes = [];
        document.getElementById('input-conc').value = ''; calcInput('C'); 
        document.getElementById('result-msg').style.display = 'none';
        
        targetConc = [0.1, 0.15, 0.2, 0.25][Math.floor(Math.random() * 4)];
        targetVol = [10, 15, 20][Math.floor(Math.random() * 3)]; 
        initialBuretteLevel = Math.random() * 5; currentBuretteLevel = initialBuretteLevel;
        requiredVol = (targetConc * targetVol) / STD_CONC;

        examDisplay.innerHTML = `[실험 기초 데이터]<br>미지 시료: <b style="color:#e67e22">${targetVol} mL</b> &nbsp;|&nbsp; NaOH: <b>${STD_CONC} M</b>`;
    }

    function getLiquidSurfaceY() {
        const currentTotalVol = targetVol + droppedVol; 
        let surfaceY = F_BOTTOM_Y - 15 - (currentTotalVol * 2.2);
        if (surfaceY < F_NECK_BOTTOM_Y) surfaceY = F_NECK_BOTTOM_Y; 
        return surfaceY;
    }

    function buildFlaskPath(context) {
        context.beginPath();
        context.moveTo(CX - F_RADIUS_TOP, F_TOP_Y); context.lineTo(CX + F_RADIUS_TOP, F_TOP_Y);
        context.lineTo(CX + F_RADIUS_TOP, F_NECK_BOTTOM_Y); context.lineTo(CX + F_RADIUS_BOTTOM, F_BOTTOM_Y);
        context.bezierCurveTo(CX + F_RADIUS_BOTTOM, F_BOTTOM_Y + 10, CX - F_RADIUS_BOTTOM, F_BOTTOM_Y + 10, CX - F_RADIUS_BOTTOM, F_BOTTOM_Y);
        context.lineTo(CX - F_RADIUS_TOP, F_NECK_BOTTOM_Y); context.closePath();
    }

    function addSplash(diff, surfaceY) {
        let fadeRate = 0, initAlpha = 0, spreadSpeed = 0, downSpeed = 0;
        if (diff < -2.5) return; 
        else if (diff < -1.0) { initAlpha = 0.6; fadeRate = 0.03; spreadSpeed = 1.2; downSpeed = 0.8 + Math.random() * 0.5; } 
        else if (diff < -0.2) { initAlpha = 0.8; fadeRate = 0.008; spreadSpeed = 0.8; downSpeed = 0.5 + Math.random() * 0.3; } 
        else if (diff < 0) { initAlpha = 0.9; fadeRate = 0.002; spreadSpeed = 0.5; downSpeed = 0.2 + Math.random() * 0.2; } 
        else return;

        splashes.push({ x: CX + (Math.random() * 20 - 10), y: surfaceY + 2, r: 3, alpha: initAlpha, fadeRate: fadeRate, spreadSpeed: spreadSpeed, downSpeed: downSpeed, swirlOffset: Math.random() * Math.PI * 2 });
    }

    function drawApparatus(showNumbers = false) {
        const surfaceY = getLiquidSurfaceY();
        const diff = droppedVol - requiredVol;

        // 뷰렛
        const bWidth = 26; 
        const glassGrad = ctx.createLinearGradient(CX - bWidth/2, 0, CX + bWidth/2, 0);
        glassGrad.addColorStop(0, '#d5dbdb'); glassGrad.addColorStop(0.3, '#ffffff'); glassGrad.addColorStop(1, '#d5dbdb');
        ctx.fillStyle = glassGrad; ctx.fillRect(CX - bWidth/2, 20, bWidth, 470);

        const liquidY = B_START_Y + (currentBuretteLevel * PIXELS_PER_ML);
        if (currentBuretteLevel < B_MAX_ML) {
            ctx.fillStyle = 'rgba(133, 193, 233, 0.25)'; ctx.beginPath();
            ctx.moveTo(CX - bWidth/2, 490); ctx.lineTo(CX - bWidth/2, liquidY);
            ctx.bezierCurveTo(CX - 10, liquidY + 6, CX + 10, liquidY + 6, CX + bWidth/2, liquidY);
            ctx.lineTo(CX + bWidth/2, 490); ctx.fill();
        }

        ctx.textAlign = 'right'; ctx.font = `bold 11px Arial`;
        for (let i = 0; i <= B_MAX_ML; i = Math.round((i + 0.1) * 10) / 10) {
            const y = B_START_Y + (i * PIXELS_PER_ML);
            ctx.strokeStyle = '#34495e';
            if (i % 1 === 0) { ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(CX, y); ctx.lineTo(CX + bWidth/2, y); ctx.stroke(); if (showNumbers) { ctx.fillStyle = '#c0392b'; ctx.fillText(i, CX - 5, y + 4); } } 
            else if (Math.round(i * 10) % 5 === 0) { ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(CX + 6, y); ctx.lineTo(CX + bWidth/2, y); ctx.stroke(); } 
            else { ctx.lineWidth = 0.4; ctx.beginPath(); ctx.moveTo(CX + 9, y); ctx.lineTo(CX + bWidth/2, y); ctx.stroke(); }
        }

        if (!showNumbers) {
            const flowVal = parseFloat(cockSlider.value);
            ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.ellipse(CX, 495, 16, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.save(); ctx.translate(CX, 510); ctx.fillStyle = '#7f8c8d'; ctx.fillRect(-12, -8, 24, 16);
            ctx.rotate((flowVal / 100) * (Math.PI / 2));
            ctx.fillStyle = '#34495e'; ctx.beginPath(); ctx.ellipse(0, 0, 18, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            ctx.fillStyle = glassGrad; ctx.fillRect(CX - 3, 520, 6, TIP_BOTTOM_Y - 520); 

            if (isStarted && flowVal > 0 && currentBuretteLevel < B_MAX_ML) {
                if (flowVal < 30) { if (Math.random() < flowVal / 25) drops.push({ y: TIP_BOTTOM_Y, speed: 6 + Math.random() * 2 }); } 
                else { ctx.fillStyle = 'rgba(133, 193, 233, 0.6)'; ctx.fillRect(CX - 1.5, TIP_BOTTOM_Y, 3, surfaceY - TIP_BOTTOM_Y); if (Math.random() < 0.3) addSplash(diff, surfaceY); }
            }
        }

        // 플라스크
        if (!showNumbers) {
            let baseColor = 'rgba(230, 240, 248, 0.4)'; 
            if (isStarted && diff >= 0 && diff < 0.3) baseColor = 'rgba(255, 105, 180, 0.55)'; 
            else if (isStarted && diff >= 0.3) baseColor = 'rgba(255, 20, 147, 0.85)'; 

            ctx.save(); buildFlaskPath(ctx); ctx.clip(); 

            if (isStarted || targetVol > 0) {
                ctx.fillStyle = baseColor; ctx.fillRect(CX - F_RADIUS_BOTTOM, surfaceY, F_RADIUS_BOTTOM * 2, F_BOTTOM_Y - surfaceY + 20);
                let currentR = F_RADIUS_TOP; if (surfaceY > F_NECK_BOTTOM_Y) currentR = F_RADIUS_TOP + (F_RADIUS_BOTTOM - F_RADIUS_TOP) * ((surfaceY - F_NECK_BOTTOM_Y) / (F_BOTTOM_Y - F_NECK_BOTTOM_Y));
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; ctx.beginPath(); ctx.ellipse(CX, surfaceY, currentR, currentR * 0.15, 0, 0, Math.PI * 2); ctx.fill();
            }

            splashes.forEach((s, idx) => {
                s.r += s.spreadSpeed; s.y += s.downSpeed; s.x += Math.sin(s.y * 0.1 + s.swirlOffset) * 0.8; s.alpha -= s.fadeRate;      
                if (s.alpha > 0) { let grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r); grad.addColorStop(0, `rgba(255, 105, 180, ${s.alpha})`); grad.addColorStop(1, `rgba(255, 105, 180, 0)`); ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); } 
                else { splashes.splice(idx, 1); }
            });
            ctx.restore(); 

            buildFlaskPath(ctx); ctx.strokeStyle = '#9aa5b1'; ctx.lineWidth = 1.5; ctx.stroke();
            const flaskGrad = ctx.createLinearGradient(CX - F_RADIUS_BOTTOM, 0, CX + F_RADIUS_BOTTOM, 0);
            flaskGrad.addColorStop(0, 'rgba(255,255,255,0.7)'); flaskGrad.addColorStop(0.2, 'rgba(255,255,255,0.1)');
            flaskGrad.addColorStop(0.8, 'rgba(255,255,255,0.1)'); flaskGrad.addColorStop(1, 'rgba(255,255,255,0.5)');
            ctx.fillStyle = flaskGrad; ctx.fill();

            ctx.beginPath(); ctx.moveTo(CX - 12, F_TOP_Y + 5); ctx.lineTo(CX - 12, F_NECK_BOTTOM_Y); ctx.lineTo(CX - 72, F_BOTTOM_Y - 8);
            ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const surfaceY = getLiquidSurfaceY(); const diff = droppedVol - requiredVol;

        for (let i = drops.length - 1; i >= 0; i--) {
            let drop = drops[i]; drop.y += drop.speed;
            ctx.fillStyle = 'rgba(133, 193, 233, 0.8)'; ctx.beginPath(); ctx.arc(CX, drop.y, 2.5, 0, Math.PI*2); ctx.fill();
            if (drop.y >= surfaceY) { drops.splice(i, 1); if (isStarted) addSplash(diff, surfaceY); }
        }

        drawApparatus(false);

        if (isMouseIn && mouseY < 520) {
            const zSize = 90;
            ctx.save(); ctx.beginPath(); ctx.arc(mouseX, mouseY, zSize, 0, Math.PI * 2); ctx.clip();
            ctx.fillStyle = "white"; ctx.fill(); ctx.translate(mouseX, mouseY); ctx.scale(2.5, 2.5); ctx.translate(-mouseX, -mouseY);
            drawApparatus(true); ctx.restore();
            ctx.strokeStyle = "#34495e"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(mouseX, mouseY, zSize, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = "rgba(231, 76, 60, 0.4)"; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(mouseX-zSize, mouseY); ctx.lineTo(mouseX+zSize, mouseY); ctx.stroke(); ctx.setLineDash([]);
        }

        const flow = parseFloat(cockSlider.value) / 2500;
        if (isStarted && flow > 0 && currentBuretteLevel < B_MAX_ML) { currentBuretteLevel += flow; droppedVol += flow; }
        requestAnimationFrame(animate);
    }

    // --- 📱 모바일 터치 대응 이벤트 핸들러 ---
    function handleMove(e) {
        if(e.type.includes('touch')) e.preventDefault(); // 스크롤 방지
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        mouseX = clientX - rect.left; mouseY = clientY - rect.top; isMouseIn = true;
    }
    function handleLeave() { isMouseIn = false; }

    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseleave', handleLeave);
    
    // 모바일 터치 이벤트 리스너 추가
    canvas.addEventListener('touchstart', handleMove, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    canvas.addEventListener('touchend', handleLeave);

    targetVol = 15; animate();
</script>
